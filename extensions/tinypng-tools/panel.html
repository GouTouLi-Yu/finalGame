<h2 class="title">TinyPNG 压缩</h2>
<p class="hint">
  选择美术资源文件夹，对其中所有 PNG/JPG 调用 TinyPNG 压缩并<strong>原地覆盖</strong>。<br/>
  不会修改 <span class="mono">assets/res</span> 下的引擎资源，覆盖进引擎请手动操作。
</p>

<ui-prop>
  <ui-label slot="label">TinyPNG API Key</ui-label>
  <div slot="content" class="folder-row">
    <ui-text-area id="apiKey" placeholder="在 tinypng.com/developers 获取，或点右侧粘贴"></ui-text-area>
    <ui-button id="btnPasteKey">粘贴</ui-button>
  </div>
</ui-prop>
<p class="hint small">也可直接编辑 <span class="mono">extensions/tinypng-tools/settings.json</span> 中的 apiKey</p>

<ui-prop>
  <ui-label slot="label">图片文件夹</ui-label>
  <div slot="content" class="folder-row">
    <ui-input id="folderPath" placeholder="选择要压缩的文件夹"></ui-input>
    <ui-button id="btnPick">选择文件夹</ui-button>
  </div>
</ui-prop>

<ui-button id="compressBtn">开始压缩</ui-button>

<div id="result" class="result hidden">
  <div id="resultTitle" class="resultTitle"></div>
  <ul id="resultList" class="resultList"></ul>
</div>
