<h2 class="title">动画一键命名</h2>
<p class="hint">
  选择序列帧文件夹，输入命名前缀，例如 <span class="mono">anim_chac_liYin_idle</span><br/>
  将生成：<span class="mono">anim_chac_liYin_idle_001.png</span>、<span class="mono">_002.png</span> …<br/>
  按当前文件名中的数字顺序排序，重命名为 <span class="mono">前缀_001</span>、<span class="mono">_002</span> …（固定三位序号）。
</p>

<ui-prop>
  <ui-label slot="label">序列帧文件夹</ui-label>
  <div slot="content" class="folder-row">
    <ui-input id="folderPath" placeholder="点击右侧按钮选择文件夹"></ui-input>
    <ui-button id="btnPick">选择文件夹</ui-button>
  </div>
</ui-prop>

<ui-prop>
  <ui-label slot="label">命名前缀</ui-label>
  <ui-input id="namePrefix" slot="content" placeholder="anim_chac_liYin_idle"></ui-input>
</ui-prop>

<ui-button id="renameBtn">开始重命名</ui-button>

<div id="result" class="result hidden">
  <div id="resultTitle" class="resultTitle"></div>
  <ul id="resultList" class="resultList"></ul>
</div>
