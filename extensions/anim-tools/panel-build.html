<h2 class="title">一键制作帧动画</h2>
<p class="hint">
  选择美术序列帧目录，例如 <span class="mono">...\美术\anim\character\liYin\battle\hurt</span><br/>
  将自动生成到 <span class="mono">assets/res/anim/character/liYin/battle/hurt</span><br/>
  含 <span class="mono">res/</span> 图片、4096 图集、<span class="mono">anim.prefab</span>、<span class="mono">animClip.anim</span>
</p>

<ui-prop>
  <ui-label slot="label">美术序列帧目录</ui-label>
  <div slot="content" class="folder-row">
    <ui-input id="folderPath" placeholder="选择 ...\美术\anim\ 下的动作文件夹"></ui-input>
    <ui-button id="btnPick">选择文件夹</ui-button>
  </div>
</ui-prop>

<ui-button id="buildBtn">开始制作</ui-button>

<div id="result" class="result hidden">
  <div id="resultTitle" class="resultTitle"></div>
  <ul id="resultList" class="resultList"></ul>
</div>
